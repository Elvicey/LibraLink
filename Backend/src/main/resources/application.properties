spring.application.name=LibraLink
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Give the application extra time to establish and validate heavy metadata requests
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.keepalive-time=30000

# Fixes issues with metadata reads during initialization
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Expo Push Notifications
expo.push.enabled=${EXPO_PUSH_ENABLED:false}

# TTS (Text-to-Speech) Configuration - Google Cloud TTS
tts.api.url=${TTS_API_URL:https://texttospeech.googleapis.com/v1/text:synthesize}
tts.api.key=${TTS_API_KEY:}
tts.storage.base-url=${TTS_STORAGE_BASE_URL:}

# AI (Generative) Configuration - OpenAI API
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_MODEL:gpt-4o-mini}

# Admin seed (used on first startup if no ADMIN user exists yet)
seed.admin.email=${SEED_ADMIN_EMAIL:admin@libralink.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
seed.admin.first-name=${SEED_ADMIN_FIRST_NAME:Admin}
seed.admin.last-name=${SEED_ADMIN_LAST_NAME:User}
