spring.application.name=LibraLink
server.port=${PORT:8080}

# Load Backend/.env directly on startup (parsed as properties) so ${...} placeholders resolve
# without manually sourcing it in the shell. optional: -> no error if the file is absent (e.g.
# on Render, where real environment variables are set instead and take precedence over this).
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema now (ddl-auto is validate-only above). baseline-on-migrate=true
# because this schema already exists (previously created by ddl-auto=update) rather than
# being created fresh by Flyway - the pre-Flyway schema is treated as baseline version 0.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Flyway's baseline-version defaults to "1", which would treat V1 itself as already
# applied (skipped) when baselining an existing schema - baseline at 0 so V1 actually runs.
spring.flyway.baseline-version=0

# Give the application extra time to establish and validate heavy metadata requests
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.keepalive-time=30000

# Fixes issues with metadata reads during initialization
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Expo Push Notifications
expo.push.enabled=${EXPO_PUSH_ENABLED:false}

# Pickup scheduling: length of a pickup window in minutes. Pickups are only accepted
# Monday–Friday, 09:00–17:00, and the whole window must fit inside those hours.
pickup.window-minutes=${PICKUP_WINDOW_MINUTES:30}

# Circulation policy: a loan runs this many days; after the due date an overdue fine of
# fine-per-day accrues each day the book is still out, capped at fine-max.
library.loan-period-days=${LOAN_PERIOD_DAYS:14}
library.fine-per-day=${FINE_PER_DAY:1.00}
library.fine-max=${FINE_MAX:20.00}

# Paystack payments (fine payments). If PAYSTACK_SECRET_KEY is blank, the initialize/verify
# endpoints return 503 and the app falls back to showing the fine unpaid. Use TEST keys
# (sk_test_/pk_test_) for development — no real money moves. Currency is GHS (pesewas).
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.currency=${PAYSTACK_CURRENCY:GHS}

# TTS (Text-to-Speech) - Google AI Studio / Gemini. Reuses AI_API_KEY and ai.api.url (same
# key as Ask Libra); Gemini returns raw PCM which the backend wraps as WAV before streaming.
tts.model=${TTS_MODEL:gemini-2.5-flash-preview-tts}
tts.voice=${TTS_VOICE:Kore}
# A book with a few hundred+ characters of real content can take Gemini's TTS model well
# past the 20s default read timeout used for other outbound APIs - this one's dedicated
# to TTS so it can run much longer without affecting faster calls (Paystack, chat, etc).
http.client.tts-read-timeout-ms=${TTS_READ_TIMEOUT_MS:90000}

# AI (Generative) Configuration - Google AI Studio / Gemini API
# ai.api.url is the API base; LlmClient appends /models/{model}:generateContent.
# If AI_API_KEY is blank, Ask Libra falls back to canned answers and exam generation is disabled.
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
ai.api.key=${AI_API_KEY:}
# gemini-flash-latest is Google's maintained "current stable flash" alias (avoids models
# being retired for new keys); override with AI_MODEL if you have quota for a specific one.
ai.api.model=${AI_MODEL:gemini-flash-latest}

password.reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}

# Brevo (transactional email API, not SMTP) - both password-reset codes and student
# self-registration email-verification codes go through this now. If unset, codes are
# logged to server logs instead (dev fallback).
brevo.api-key=${BREVO_API_KEY:}
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@libralink.com}
brevo.sender-name=${BREVO_SENDER_NAME:LibraLink}
email.verification.expiry-minutes=${EMAIL_VERIFICATION_EXPIRY_MINUTES:15}

# Admin seed (used on first startup if no ADMIN user exists yet)
seed.admin.email=${SEED_ADMIN_EMAIL:admin@libralink.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
seed.admin.first-name=${SEED_ADMIN_FIRST_NAME:Admin}
seed.admin.last-name=${SEED_ADMIN_LAST_NAME:User}

# Demo seeding: true (default) creates convenience accounts (demo student + weak-default
# admin) for local/dev. In production set SEED_DEMO_ENABLED=false — then the demo student is
# skipped and the admin will NOT be seeded with the built-in default password (an explicit
# strong SEED_ADMIN_PASSWORD is required, otherwise startup fails fast).
seed.demo.enabled=${SEED_DEMO_ENABLED:true}
