spring.application.name=LibraLink-Test

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Tests keep using entity-driven H2 schema creation, not the Postgres-targeted Flyway
# migrations (which use Postgres-specific SQL not guaranteed to run on H2).
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=dGVzdHNlY3JldGtleWZvcmp3dHRvazEyMzQ1Njc4OWFiY2RlZg==
jwt.expiration-ms=86400000

# Disable external services
expo.push.enabled=false
tts.api.key=
tts.api.url=http://localhost:1
tts.storage.base-url=http://localhost:1
ai.api.key=
ai.api.url=http://localhost:1
ai.api.model=gpt-4o-mini

# Admin seed
seed.admin.email=admin@libralink.com
seed.admin.password=admin123
seed.admin.first-name=Admin
seed.admin.last-name=User
